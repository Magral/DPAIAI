name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Build and unit tests
        run: bash gradlew assembleDebug testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DPI-Pilot-0.2.0-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
