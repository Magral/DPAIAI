name: Legacy debug publisher (disabled)
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-v0.4.1
  cancel-in-progress: false
jobs:
  publish:
    if: false # Replaced by signed-release.yml; never publish a debug APK again.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify source build and tests
        uses: actions/github-script@v7
        with:
          script: |
            let verified = false;
            for (let attempt = 0; attempt < 20; attempt++) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: 41055113268});
              if (run.head_sha !== '7b6c577308f439bb6019a31b7bb290aca0b7ff12') throw new Error('Unexpected build source');
              if (run.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error('Build or tests failed');
                verified = true; break;
              }
              await new Promise(resolve => setTimeout(resolve,15000));
            }
            if (!verified) throw new Error('Timed out waiting for tested APK');
      - uses: actions/download-artifact@v4
        with:
          name: DPI-Pilot-0.4.1-debug
          run-id: 41055113268
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const path = require('path');
            const files = fs.readdirSync('apk').filter(f => f.endsWith('.apk'));
            if (files.length !== 1) throw new Error('Expected one verified APK');
            const data = fs.readFileSync(path.join('apk',files[0]));
            const sha = crypto.createHash('sha256').update(data).digest('hex');
            const {owner,repo} = context.repo;
            const tag = 'v0.4.1';
            const comparison = await github.rest.repos.compareCommits({owner,repo,base:'7b6c577308f439bb6019a31b7bb290aca0b7ff12',head:context.sha});
            if ((comparison.data.files || []).some(f => f.filename !== '.github/workflows/publish-apk.yml')) throw new Error('Release source differs from tested app');
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:context.sha,
                name:'DPI Pilot 0.4.1 — Telegram WebSocket',draft:true,prerelease:false,
                body:"Скачайте DPI-Pilot-0.4.1.apk ниже в Assets — без ZIP.\n\nСтабилизация режима Telegram WebSocket:\n- Отключены активные RFC WebSocket ping; остаются собственные MTProto heartbeat клиента.\n- Убран локальный read timeout 300 секунд после авторизации и искусственное закрытие очереди отправки через 5 секунд; используется ограниченная очередь с обратным давлением.\n- TCP-поток собирается в полные MTProto transport packets (abridged/intermediate/padded) перед отправкой в WS; quick-ack и padding сохраняются.\n- Нормальный EOF/cancel не выдаётся за сетевую потерю. В диагностике C-ID, DC/media, этап, точная причина, длительность, tx/rx; без секретов и содержимого сообщений.\n- Переподключение предпочитает официальный endpoint, от которого получены данные; при отказе без данных сначала пробуется другая официальная alias-ссылка.\n\nВыключите ByeDPI и другие VPN → Подключить Telegram через WebSocket → Запустить режим Telegram → Подключить в Telegram и подтвердить прокси. После остановки режима отключите локальный прокси в Telegram. Звонки этим режимом не обеспечиваются.\n\nПроверка TLS включена; сторонние relay-серверы не используются. Аккаунтное MTProto-шифрование не расшифровывается. Результат на конкретном провайдере и аккаунте ещё требует проверки на телефоне.\n\nТесты: все варианты дробления/объединения transport packets, extended и quick-ack заголовки, ограничения размера; двусторонний обмен через локальный WS с разбитым TCP и нормальное завершение без ложного сбоя.\n\nAPK с отладочной подписью. Если Android сообщает конфликт подписей, удалите предыдущую сборку перед установкой.\n\nGPL-3.0; авторство исходных компонентов сохранено.\nSource: 7b6c577308f439bb6019a31b7bb290aca0b7ff12\nSHA-256 APK: "+sha
              })).data;
            }
            const name = 'DPI-Pilot-0.4.1.apk';
            const assets = (await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id})).data;
            const existing = assets.find(a => a.name === name);
            if (!existing) {
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name,data,
                headers:{'content-type':'application/vnd.android.package-archive','content-length':data.length}});
            } else if (existing.digest && existing.digest !== 'sha256:'+sha) {
              throw new Error('Existing release APK differs; refusing overwrite');
            }
            if (release.draft) release = (await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false})).data;
            core.notice(release.html_url);

