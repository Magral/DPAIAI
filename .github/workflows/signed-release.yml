# Releases focus on YouTube and Instagram.
name: Signed APK release
on:
  push:
    branches: [main]
    paths: [app/release-request.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signed-apk-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require permanent signing identity
        env:
          SIGNING_BUNDLE: ${{ secrets.DPI_PILOT_SIGNING }}
        run: |
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo "::error::Configure permanent signing secrets first; no unsigned/debug release will be published."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;26.1.10909125' 'cmake;3.22.1'
      - name: Restore private signing key
        env:
          DPI_PILOT_SIGNING: ${{ secrets.DPI_PILOT_SIGNING }}
        run: python3 scripts/restore-signing.py
      - name: Verify all pinned catalog commands and phone JNI
        run: |
          python3 tv/strategies/build_catalog.py --check
          python3 app/src/test/python/mobile_jni_test.py
          python3 tv/src/test/python/udp_policy_test.py
          bash tv/test-quic.sh
      - name: Prepare real signed catalog fixture
        run: python3 tv/strategies/prepare_fixture.py
      - name: Build and test release
        run: bash gradlew :app:assembleRelease :app:testReleaseUnitTest --stacktrace
      - name: Verify simultaneous Instagram and YouTube routing
        run: python3 app/src/test/python/mobile_dual_test.py
      - name: Verify permanent certificate and prepare APK
        run: |
          bash scripts/verify-release.sh app/build/outputs/apk/release/app-release.apk
          python3 scripts/check-mobile-apk.py app/build/outputs/apk/release/app-release.apk
          python3 - <<'PY'
          import hashlib, pathlib, re, shutil
          source = pathlib.Path("app/build.gradle.kts").read_text()
          version = re.search(r'versionName = "([0-9]+\.[0-9]+\.[0-9]+)"', source).group(1)
          out = pathlib.Path("release")
          out.mkdir()
          apk = out / f"DPI-Pilot-{version}.apk"
          shutil.copyfile("app/build/outputs/apk/release/app-release.apk", apk)
          (out / "SHA256SUMS").write_text(hashlib.sha256(apk.read_bytes()).hexdigest() + "  " + apk.name + "\n")
          PY
      - name: Remove private key
        if: always()
        run: rm -f "$RUNNER_TEMP/dpipilot-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: DPI-Pilot-signed-release
          path: release/*
          if-no-files-found: error
      - name: Publish installable APK
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner,repo} = context.repo;
            const files = fs.readdirSync('release').filter(f => f.endsWith('.apk'));
            if (files.length !== 1) throw new Error('Expected exactly one signed APK');
            const name = files[0];
            const version = name.match(/^DPI-Pilot-([0-9]+\.[0-9]+\.[0-9]+)\.apk$/)[1];
            const tag = 'v'+version;
            const {data: head} = await github.rest.git.getRef({owner,repo,ref:'heads/main'});
            if (context.ref !== 'refs/heads/main' || head.object.sha !== context.sha)
              throw new Error('Release must use current main; rebuild after source changes');
            const data = fs.readFileSync('release/'+name);
            const digest = 'sha256:'+crypto.createHash('sha256').update(data).digest('hex');
            let release;
            try { release = (await github.rest.repos.getReleaseByTag({owner,repo,tag})).data; }
            catch (e) {
              if (e.status !== 404) throw e;
              release = (await github.rest.repos.createRelease({
                owner,repo,tag_name:tag,target_commitish:context.sha,name:'DPI Pilot '+version,
                draft:true,prerelease:false,
                body:'Мобильная версия для Instagram и YouTube вместе: выбор приложений и целей убран. Независимые native-движки за одним VPN; смена маршрута одного сервиса сохраняет обработчик и открытые соединения второго. Два слота на сервис, до 2 минут испытания новой команды, резерв и откат; старые соединения завершаются на прежнем обработчике.\n\nПо умолчанию тихий режим: проверка при запуске, смене сети, восстановлении движка и по кнопке «не работает». После успеха нет плановых сетевых проб и оптимизации стратегии; автоматический стартовый поиск ограничен небольшим блоком. Периодический контроль можно включить отдельно, он выключен по умолчанию. Обновление подписанной базы не переключает стратегию.\n\nИстория резервов по сервису/сети, восстановление ранее включённого VPN после перезагрузки по возможности Android, импорт/экспорт профилей через файл с проверкой команд, состояние источников базы. Публичные пробы и счётчики обмена не гарантируют работу конкретного видео или аккаунта.\n\nУстановка поверх прежней телефонной версии с постоянной подписью. Нажмите «Включить VPN»: Instagram и YouTube подключаются автоматически. Документация: docs/MOBILE_080.md.\n\nSource: '+context.sha+'\nSHA-256 APK: '+digest.slice(7)
              })).data;
            }
            const assets = (await github.rest.repos.listReleaseAssets({owner,repo,release_id:release.id})).data;
            const existing = assets.find(a => a.name === name);
            if (existing) {
              if (existing.digest !== digest) throw new Error('Existing APK differs; refusing overwrite');
            } else {
              if (!release.draft) throw new Error('Refusing to change an already published release');
              await github.rest.repos.uploadReleaseAsset({owner,repo,release_id:release.id,name,data,
                headers:{'content-type':'application/vnd.android.package-archive','content-length':data.length}});
            }
            if (release.draft) await github.rest.repos.updateRelease({owner,repo,release_id:release.id,draft:false});
            core.notice(release.html_url);

